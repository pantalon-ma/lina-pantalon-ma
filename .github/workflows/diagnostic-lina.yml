# Test manuel de Lina (comme un navigateur : pré-vérification CORS puis message)
name: Diagnostic Lina
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Pre-verification CORS (OPTIONS)
        run: |
          curl -sS -i --max-time 60 -X OPTIONS https://lina-pantalon-ma.onrender.com/chat \
            -H "Origin: https://pantalon.ma" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" | head -30
      - name: Message avec en-tetes
        run: |
          curl -sS -i -N --max-time 60 -X POST https://lina-pantalon-ma.onrender.com/chat \
            -H "Origin: https://pantalon.ma" -H "Content-Type: application/json" -H "Accept: text/event-stream" \
            -d '{"message":"Test","prompt_type":"pantalonMa"}' | head -c 2500; echo
      - name: Origin www
        run: |
          curl -sS -i --max-time 60 -X OPTIONS https://lina-pantalon-ma.onrender.com/chat \
            -H "Origin: https://www.pantalon.ma" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" | head -20

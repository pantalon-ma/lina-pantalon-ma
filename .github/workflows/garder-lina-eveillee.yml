# Garde Lina éveillée sur Render (offre gratuite = mise en veille après 15 min sans visite).
# Appel toutes les 10 minutes de 7h à minuit (heure du Maroc). Dépôt public = minutes GitHub Actions illimitées.
name: Garder Lina éveillée
on:
  schedule:
    - cron: "*/10 7-23 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Réveiller Lina
        run: curl -s -o /dev/null -w "%{http_code}\n" --max-time 90 https://lina-pantalon-ma.onrender.com/healthz || true
